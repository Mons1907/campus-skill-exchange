
{% extends "base.html" %}
{% block title %}Login | SkillBridge{% endblock %}
{% block content %}
<section class="auth-wrap">
<div class="auth-card">
    <span class="eyebrow">WELCOME BACK</span>
    <h1>Continue learning.</h1>
    <p class="muted">Log in to connect with your campus community.</p>
    <form method="POST" class="form-stack">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" required placeholder="you@example.com">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required placeholder="Your password">
        <button class="btn btn-primary full-width" type="submit">Log in →</button>
    </form>
    <p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
</section>
{% endblock %}
